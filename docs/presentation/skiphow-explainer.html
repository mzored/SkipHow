:root[data-theme=&quot;light&quot;] {

html &gt; body {

    light-dark(rgb(255 255 255), rgb(24 24 24))

.form-range::-moz-range-track {

  &lt;header class=&quot;sh-head&quot;&gt;

  &lt;div class=&quot;sh-panel&quot; id=&quot;sh-contract&quot; role=&quot;region&quot; aria-labelledby=&quot;sh-tab-contract&quot;&gt;
    &lt;p class=&quot;sh-caption&quot;&gt;Владелец формулирует, что должно стать правдой. Агент сам выбирает инженерный путь и отвечает за доказанный результат.&lt;/p&gt;
    &lt;div class=&quot;sh-contract&quot;&gt;
      &lt;section class=&quot;sh-party&quot; aria-labelledby=&quot;sh-owner-title&quot;&gt;
        &lt;h3 id=&quot;sh-owner-title&quot;&gt;Владелец продукта&lt;/h3&gt;
        &lt;ul&gt;
          &lt;li&gt;Результат и видимое поведение&lt;/li&gt;
          &lt;li&gt;Приоритет, стоимость и риск&lt;/li&gt;
          &lt;li&gt;Защищённые действия&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/section&gt;
      &lt;div class=&quot;sh-arrow&quot; aria-hidden=&quot;true&quot;&gt;
        &lt;svg viewBox=&quot;0 0 64 24&quot;&gt;&lt;path d=&quot;M2 12h54M48 4l10 8-10 8&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/svg&gt;
      &lt;/div&gt;
      &lt;section class=&quot;sh-party&quot; aria-labelledby=&quot;sh-agent-title&quot;&gt;
        &lt;h3 id=&quot;sh-agent-title&quot;&gt;Агент-разработчик&lt;/h3&gt;
        &lt;ul&gt;
          &lt;li&gt;Исследование и техническое решение&lt;/li&gt;
          &lt;li&gt;Код, тесты и ветки&lt;/li&gt;
          &lt;li&gt;Проверка и честный отчёт&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/section&gt;
      &lt;div class=&quot;sh-contract-note&quot;&gt;SkipHow держит границу решений и полномочий&lt;/div&gt;

  &lt;div class=&quot;sh-panel&quot; id=&quot;sh-anatomy&quot; role=&quot;region&quot; aria-labelledby=&quot;sh-tab-anatomy&quot; hidden&gt;
    &lt;p class=&quot;sh-caption&quot;&gt;SkipHow не заменяет агента и его среду. Контракт велит агенту открывать только нужные методы. Насколько надёжно среды следуют этому правилу, пока не доказано.&lt;/p&gt;
    &lt;div class=&quot;sh-architecture&quot;&gt;
      &lt;section class=&quot;sh-host&quot; aria-labelledby=&quot;sh-host-title&quot;&gt;
        &lt;h3 id=&quot;sh-host-title&quot;&gt;Claude Code или Codex&lt;/h3&gt;
        &lt;div class=&quot;sh-host-items&quot;&gt;
          &lt;span&gt;модели&lt;/span&gt;&lt;span&gt;инструменты&lt;/span&gt;&lt;span&gt;разрешения&lt;/span&gt;&lt;span&gt;сессии&lt;/span&gt;&lt;span&gt;доступы&lt;/span&gt;&lt;span&gt;подагенты&lt;/span&gt;
        &lt;/div&gt;
        &lt;span class=&quot;text-small&quot;&gt;Среда запускает работу и даёт агенту технические возможности.&lt;/span&gt;
      &lt;/section&gt;
      &lt;div class=&quot;sh-skill-stack&quot; aria-label=&quot;Один публичный навык SkipHow&quot;&gt;
        &lt;section class=&quot;sh-kernel&quot;&gt;
          &lt;h3&gt;Один навык. Ядро правил всегда в контексте&lt;/h3&gt;
          &lt;div class=&quot;sh-kernel-grid&quot;&gt;
            &lt;span&gt;полномочия&lt;/span&gt;&lt;span&gt;автономность&lt;/span&gt;&lt;span&gt;сохранность&lt;/span&gt;&lt;span&gt;доказательства&lt;/span&gt;
          &lt;/div&gt;
        &lt;/section&gt;
        &lt;section class=&quot;sh-methods&quot;&gt;
          &lt;h3&gt;Фокусные методы по ситуации&lt;/h3&gt;
          &lt;div class=&quot;sh-method-grid&quot;&gt;
            &lt;span class=&quot;sh-method-chip sh-active&quot;&gt;диагностика&lt;/span&gt;
            &lt;span class=&quot;sh-method-chip&quot;&gt;исследование&lt;/span&gt;
            &lt;span class=&quot;sh-method-chip sh-active&quot;&gt;тестирование&lt;/span&gt;
            &lt;span class=&quot;sh-method-chip&quot;&gt;доставка&lt;/span&gt;
            &lt;span class=&quot;sh-method-chip&quot;&gt;делегирование&lt;/span&gt;
            &lt;span class=&quot;sh-method-chip&quot;&gt;продолжение работы&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;sh-pull-note&quot;&gt;
            &lt;svg viewBox=&quot;0 0 48 18&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M46 9H6M14 2L5 9l9 7&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/svg&gt;
            &lt;span&gt;По правилам SkipHow, задача определяет нужный метод. Это не обязательный конвейер.&lt;/span&gt;
          &lt;/div&gt;
        &lt;/section&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;sh-panel&quot; id=&quot;sh-tech&quot; role=&quot;region&quot; aria-labelledby=&quot;sh-tab-tech&quot; hidden&gt;
    &lt;p class=&quot;sh-caption&quot;&gt;Это поток инструкций и полномочий, а не встроенный оркестратор. Работу исполняет Codex или Claude Code средствами, которые доступны в проекте.&lt;/p&gt;
    &lt;div class=&quot;sh-tech&quot;&gt;
      &lt;div class=&quot;sh-tech-entry&quot; aria-label=&quot;Вход в технический поток&quot;&gt;
        &lt;div class=&quot;sh-tech-node&quot; data-tech-node=&quot;0&quot;&gt;
          &lt;span&gt;Запрос владельца&lt;/span&gt;
          &lt;strong&gt;Результат, ограничения и важный риск обычным языком&lt;/strong&gt;
        &lt;/div&gt;
        &lt;div class=&quot;sh-tech-link&quot; data-tech-link=&quot;1&quot; aria-hidden=&quot;true&quot;&gt;
          &lt;svg viewBox=&quot;0 0 44 22&quot;&gt;&lt;path d=&quot;M2 11h34M30 5l7 6-7 6&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/svg&gt;
        &lt;/div&gt;
        &lt;div class=&quot;sh-tech-node&quot; data-tech-node=&quot;1&quot;&gt;
          &lt;span&gt;Выбор навыка&lt;/span&gt;
          &lt;strong&gt;Среда пытается выбрать &lt;code&gt;skiphow&lt;/code&gt; автоматически. Если промахнулась, навык вызывают явно&lt;/strong&gt;
        &lt;/div&gt;
        &lt;div class=&quot;sh-tech-link&quot; data-tech-link=&quot;2&quot; aria-hidden=&quot;true&quot;&gt;
          &lt;svg viewBox=&quot;0 0 44 22&quot;&gt;&lt;path d=&quot;M2 11h34M30 5l7 6-7 6&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/svg&gt;
        &lt;/div&gt;
        &lt;div class=&quot;sh-tech-node sh-tech-core&quot; data-tech-node=&quot;2&quot;&gt;
          &lt;span&gt;Ядро SkipHow&lt;/span&gt;
          &lt;strong&gt;Полномочия, автономность, сохранность чужой работы и доказательства&lt;/strong&gt;
        &lt;/div&gt;
        &lt;div class=&quot;sh-tech-link&quot; data-tech-link=&quot;3&quot; aria-hidden=&quot;true&quot;&gt;
          &lt;svg viewBox=&quot;0 0 44 22&quot;&gt;&lt;path d=&quot;M2 11h34M30 5l7 6-7 6&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/svg&gt;
        &lt;/div&gt;
        &lt;div class=&quot;sh-tech-node&quot; data-tech-node=&quot;3&quot;&gt;
          &lt;span&gt;Контекст проекта&lt;/span&gt;
          &lt;strong&gt;Агент читает инструкции, код, решения и текущее состояние рабочих копий&lt;/strong&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;sh-decision-row&quot;&gt;
        &lt;div class=&quot;sh-decision&quot;&gt;Что именно разрешает этот запрос?&lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;sh-lanes&quot;&gt;
        &lt;section class=&quot;sh-lane&quot;&gt;
          &lt;h3&gt;Только анализ&lt;/h3&gt;
          &lt;ol&gt;
            &lt;li&gt;&lt;span&gt;Тип запроса&lt;/span&gt;&lt;strong&gt;Ответ, сравнение, диагностика, обзор или план&lt;/strong&gt;&lt;/li&gt;
            &lt;li&gt;&lt;span&gt;Граница&lt;/span&gt;&lt;strong&gt;Никаких изменений, сообщений и доставки наружу&lt;/strong&gt;&lt;/li&gt;
            &lt;li&gt;&lt;span&gt;Финиш&lt;/span&gt;&lt;strong&gt;Вывод с фактами, источниками и честной неопределённостью&lt;/strong&gt;&lt;/li&gt;
          &lt;/ol&gt;
        &lt;/section&gt;

        &lt;section class=&quot;sh-lane sh-lane-change&quot;&gt;
          &lt;h3&gt;Локальное изменение&lt;/h3&gt;
          &lt;ol&gt;
            &lt;li&gt;&lt;span&gt;Метод&lt;/span&gt;&lt;strong&gt;Агент открывает подходящую дисциплину: диагностику, тестирование или другую&lt;/strong&gt;&lt;/li&gt;
            &lt;li&gt;&lt;span&gt;Исполнение&lt;/span&gt;&lt;strong&gt;Сам выбирает архитектуру, код, тесты, ветки и нужные инструменты&lt;/strong&gt;&lt;/li&gt;
            &lt;li&gt;&lt;span&gt;Проверка&lt;/span&gt;&lt;strong&gt;Запускает проверки проекта на финальном состоянии и делает чистый локальный коммит&lt;/strong&gt;&lt;/li&gt;
          &lt;/ol&gt;
          &lt;div class=&quot;sh-loop&quot;&gt;
            &lt;svg viewBox=&quot;0 0 48 34&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M39 27H16a10 10 0 0 1 0-20h21M31 2l7 5-7 5&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/svg&gt;
            &lt;strong&gt;Проверка не прошла: найти причину, исправить и запустить снова. Тест не ослаблять.&lt;/strong&gt;
          &lt;/div&gt;
        &lt;/section&gt;

        &lt;section class=&quot;sh-lane&quot;&gt;
          &lt;h3&gt;Нужен владелец&lt;/h3&gt;
          &lt;ol&gt;
            &lt;li&gt;&lt;span&gt;Остановка&lt;/span&gt;&lt;strong&gt;Открыт продуктовый выбор или требуется защищённое действие&lt;/strong&gt;&lt;/li&gt;
            &lt;li&gt;&lt;span&gt;Вопрос&lt;/span&gt;&lt;strong&gt;Агент объясняет видимые последствия и рекомендует один вариант&lt;/strong&gt;&lt;/li&gt;
            &lt;li&gt;&lt;span&gt;Возврат&lt;/span&gt;&lt;strong&gt;После ответа или точного разрешения работа продолжается по подходящей дорожке&lt;/strong&gt;&lt;/li&gt;
          &lt;/ol&gt;
        &lt;/section&gt;
      &lt;/div&gt;

      &lt;section class=&quot;sh-tech-result&quot;&gt;
        &lt;h3&gt;Один итог для владельца&lt;/h3&gt;
        &lt;p&gt;Что стало правдой, чем это проверено, что осталось неопределённым и какое действие всё ещё требует человека.&lt;/p&gt;
      &lt;/section&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;sh-panel&quot; id=&quot;sh-parallel-panel&quot; role=&quot;region&quot; aria-labelledby=&quot;sh-tab-parallel&quot; hidden&gt;
    &lt;p class=&quot;sh-caption&quot;&gt;Параллельная работа не включается по умолчанию. Она уместна, когда части задачи можно закончить, проверить и принять независимо друг от друга.&lt;/p&gt;
    &lt;section class=&quot;sh-parallel&quot;&gt;
        &lt;h3&gt;Несколько дорожек, один исходный результат&lt;/h3&gt;
        &lt;p&gt;Каждая дорожка получает отдельную рабочую копию, один результат и свою проверку.&lt;/p&gt;
        &lt;div class=&quot;sh-parallel-map&quot;&gt;
          &lt;div class=&quot;sh-parallel-step&quot;&gt;
            &lt;span&gt;Разбиение&lt;/span&gt;
            &lt;strong&gt;Один проверяемый результат на дорожку&lt;/strong&gt;
          &lt;/div&gt;
          &lt;div class=&quot;sh-tech-link&quot; aria-hidden=&quot;true&quot;&gt;
            &lt;svg viewBox=&quot;0 0 44 22&quot;&gt;&lt;path d=&quot;M2 11h34M30 5l7 6-7 6&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/svg&gt;
          &lt;/div&gt;
          &lt;div class=&quot;sh-parallel-lanes&quot;&gt;
            &lt;div class=&quot;sh-parallel-lane&quot;&gt;&lt;strong&gt;Рабочая копия A&lt;/strong&gt;&lt;span&gt;отдельная часть → своя проверка&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;sh-parallel-lane&quot;&gt;&lt;strong&gt;Рабочая копия B&lt;/strong&gt;&lt;span&gt;отдельная часть → своя проверка&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;sh-parallel-lane&quot;&gt;&lt;strong&gt;Рабочая копия C&lt;/strong&gt;&lt;span&gt;отдельная часть → своя проверка&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;sh-tech-link&quot; aria-hidden=&quot;true&quot;&gt;
            &lt;svg viewBox=&quot;0 0 44 22&quot;&gt;&lt;path d=&quot;M2 11h34M30 5l7 6-7 6&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/svg&gt;
          &lt;/div&gt;
          &lt;div class=&quot;sh-parallel-step&quot;&gt;
            &lt;span&gt;Сведение&lt;/span&gt;
            &lt;strong&gt;Проверить вместе, интегрировать и закрыть исходный результат&lt;/strong&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;p class=&quot;sh-parallel-note&quot;&gt;Изолированные рабочие копии и подагенты даёт среда. SkipHow задаёт правила их использования. Надёжность делегирования в контролируемых запусках пока не доказана.&lt;/p&gt;
    &lt;/section&gt;
  &lt;/div&gt;

  &lt;div class=&quot;sh-panel&quot; id=&quot;sh-limits&quot; role=&quot;region&quot; aria-labelledby=&quot;sh-tab-limits&quot; hidden&gt;
    &lt;p class=&quot;sh-caption&quot;&gt;SkipHow отвечает только за правила поведения. Технические возможности даёт среда, а продуктовые решения остаются у человека.&lt;/p&gt;
    &lt;div class=&quot;sh-boundaries&quot;&gt;
      &lt;section class=&quot;sh-boundary-band&quot;&gt;
        &lt;h3&gt;Codex или Claude Code&lt;/h3&gt;
        &lt;p&gt;Запускает модель, даёт изолированную среду, инструменты, разрешения, сессии и доступы.&lt;/p&gt;
      &lt;/section&gt;
      &lt;section class=&quot;sh-boundary-band sh-core&quot;&gt;
        &lt;h3&gt;SkipHow&lt;/h3&gt;
        &lt;p&gt;Держит границу ответственности, подбирает дисциплину задачи и требует проверяемый результат.&lt;/p&gt;
      &lt;/section&gt;
      &lt;section class=&quot;sh-boundary-band&quot;&gt;
        &lt;h3&gt;Проект&lt;/h3&gt;
        &lt;p&gt;Задаёт архитектуру, проверки, безопасность, выпуск и правила доставки.&lt;/p&gt;
      &lt;/section&gt;
    &lt;/div&gt;
    &lt;div class=&quot;sh-protected&quot;&gt;
      &lt;div&gt;&lt;strong&gt;Обычная локальная работа&lt;/strong&gt;&lt;br&gt;&lt;span&gt;агент продолжает сам&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;sh-lock&quot; aria-hidden=&quot;true&quot;&gt;
        &lt;svg viewBox=&quot;0 0 40 40&quot;&gt;&lt;rect x=&quot;7&quot; y=&quot;17&quot; width=&quot;26&quot; height=&quot;19&quot; rx=&quot;5&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;/&gt;&lt;path d=&quot;M13 17v-5a7 7 0 0 1 14 0v5M20 24v6&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;/svg&gt;
      &lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;Продакшен, доступы, секреты, удаление&lt;/strong&gt;&lt;br&gt;&lt;span&gt;нужно точное разрешение владельца&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;skiphow-explainer&#x27;);
      if (!root) return;

      const tabButtons = [...root.querySelectorAll(&#x27;.sh-tabs [data-panel]&#x27;)];
      const panels = [...root.querySelectorAll(&#x27;.sh-panel&#x27;)];
      tabButtons.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          tabButtons.forEach((item) =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, String(item === button)));
          panels.forEach((panel) =&gt; { panel.hidden = panel.id !== button.dataset.panel; });
        });
      });

      const cases = {
        bug: {
          nodes: [
            [&#x27;Запрос&#x27;, &#x27;«Итоги перекрываются на маленьком экране. Найди причину и исправь.»&#x27;],
            [&#x27;Разбор&#x27;, &#x27;Агент читает проект, воспроизводит дефект и открывает методы диагностики и тестирования.&#x27;],
            [&#x27;Работа&#x27;, &#x27;Сам выбирает техническое решение, правит код и не ослабляет проверку.&#x27;],
            [&#x27;Доказательство&#x27;, &#x27;Проверяет исправленный экран и отчётливо называет, что показал тест.&#x27;]
          ],
          accent: [1, 3],
          result: &#x27;Владелец получает исправленное поведение, а не список технических решений для согласования.&#x27;
        },
        research: {
          nodes: [
            [&#x27;Запрос&#x27;, &#x27;«Сравни варианты кэширования и порекомендуй один. Код не меняй.»&#x27;],
            [&#x27;Граница&#x27;, &#x27;SkipHow видит, что нужен только анализ. Изменения проекта не разрешены.&#x27;],
            [&#x27;Работа&#x27;, &#x27;Агент проверяет актуальные первичные источники и сравнивает варианты в контексте проекта.&#x27;],
            [&#x27;Результат&#x27;, &#x27;Даёт рекомендацию, основания и остающуюся неопределённость.&#x27;]
          ],
          accent: [1, 2],
          result: &#x27;Фраза «код не меняй» остаётся жёсткой границей, даже если агент уже понимает, как всё реализовать.&#x27;
        },
        choice: {
          nodes: [
            [&#x27;Запрос&#x27;, &#x27;«Сделай onboarding проще.»&#x27;],
            [&#x27;Проверка&#x27;, &#x27;Агент читает продукт и отделяет решённые факты от реального выбора поведения.&#x27;],
            [&#x27;Вопрос владельцу&#x27;, &#x27;Кратко показывает видимые последствия, рекомендует вариант и ждёт ответа.&#x27;],
            [&#x27;После ответа&#x27;, &#x27;Сам решает инженерные детали, строит, проверяет и сообщает результат.&#x27;]
          ],
          accent: [2],
          result: &#x27;Владелец принимает только продуктовый выбор. Библиотеки, схемы и тестовая стратегия остаются у агента.&#x27;
        }
      };

      const caseButtons = [...root.querySelectorAll(&#x27;[data-case]&#x27;)];
      const caseNodes = [...root.querySelectorAll(&#x27;[data-case-node]&#x27;)];
      const caseResult = root.querySelector(&#x27;#sh-case-result&#x27;);

      function renderCase(key) {
        const selected = cases[key];
        caseButtons.forEach((button) =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.case === key)));
        caseNodes.forEach((node, index) =&gt; {
          const content = selected.nodes[index];
          node.innerHTML = &#x27;&lt;span class=&quot;sh-node-label&quot;&gt;&#x27; + content[0] + &#x27;&lt;/span&gt;&lt;strong&gt;&#x27; + content[1] + &#x27;&lt;/strong&gt;&#x27;;
          node.dataset.state = selected.accent.includes(index) ? &#x27;accent&#x27; : &#x27;neutral&#x27;;
        });
        caseResult.textContent = selected.result;
      }

      caseButtons.forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; renderCase(button.dataset.case)));
      renderCase(&#x27;bug&#x27;);
    })();
  &lt;/script&gt;
&lt;/section&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
