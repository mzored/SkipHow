name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openai/codex
          ref: 333beecd41281b1350688b417a2f20c66e2a743e
          path: .codex-validator
          persist-credentials: false
          sparse-checkout: codex-rs/skills/src/assets/samples/plugin-creator/scripts
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check.py --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - run: python scripts/check_hosts.py --require-codex-validator --skip-install
        env:
          CODEX_PLUGIN_VALIDATOR: ${{ github.workspace }}/.codex-validator/codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py
