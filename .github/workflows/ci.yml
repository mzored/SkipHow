name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: 333beecd41281b1350688b417a2f20c66e2a743e
          path: .codex-validator
          sparse-checkout: codex-rs/skills/src/assets/samples/plugin-creator/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/verify_release.py --base "${{ github.event.pull_request.base.sha || github.event.before }}"
        env:
          CODEX_PLUGIN_VALIDATOR: ${{ github.workspace }}/.codex-validator/codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py
