name: Capability request
description: Propose a product request SkipHow should handle.
title: "capability: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the product-owner problem SkipHow should handle.
    validations:
      required: true
  - type: textarea
    id: example_request
    attributes:
      label: Example request
      description: Show how an owner would ask for this in ordinary language.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected result
      description: Describe the result, any records that must remain, and when SkipHow should stop.
    validations:
      required: true
  - type: textarea
    id: host_evidence
    attributes:
      label: Host constraints
      description: Note any known difference between Codex, Claude Code, or another host.
    validations:
      required: false
