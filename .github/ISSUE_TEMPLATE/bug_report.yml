name: Bug report
description: Report a reproducible problem in SkipHow.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Do not include secrets or vulnerability details. Use the security policy for private reports."
  - type: input
    id: skiphow_version
    attributes:
      label: SkipHow version
      description: Name the installed SkipHow version or commit.
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host and version
      description: Name the host and its version.
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request that failed
      description: Copy the natural-language request and note any explicit host invocation you used.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction steps and evidence
    validations:
      required: true
