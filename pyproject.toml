[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skiphow-runner"
version = "0.8.0"
description = "Optional local durable runner for the SkipHow plugin"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "mzored"}]
dependencies = []

[project.scripts]
skiphow = "skiphow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
